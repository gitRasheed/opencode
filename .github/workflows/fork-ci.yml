# fork-only shim: upstream CI runs on Blacksmith runners this fork does not
# have, so this mirrors the same commands on GitHub-hosted ubuntu-latest.
# never included in PR branches.
name: fork-ci
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch to verify
        required: true
        type: string
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun turbo typecheck
      - run: GITHUB_ACTIONS=false bun turbo test
      - run: bun run check:generated
        working-directory: packages/client
      - run: bun run test:httpapi
        working-directory: packages/opencode
